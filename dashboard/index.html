<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <title>闲鱼新货雷达</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="闲鱼新货雷达首页">
        <span class="brand-mark" aria-hidden="true">鱼</span>
        <span>
          <strong>闲鱼新货雷达</strong>
          <small>NEW LISTING MONITOR</small>
        </span>
      </a>
      <div class="topbar-status" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <span id="topStatus">读取状态中</span>
      </div>
    </header>

    <main class="workspace">
      <aside class="control-rail" aria-label="监控设置">
        <div class="rail-heading">
          <span class="section-label">监控条件</span>
          <span class="sort-lock">新发布 · 最新</span>
        </div>

        <form id="controlForm" class="control-form">
          <div class="field keyword-field">
            <label for="keyword">搜索关键词</label>
            <div class="keyword-input">
              <input id="keyword" name="keyword" maxlength="80" value="mardi短袖" autocomplete="off">
              <button id="keywordSearchButton" class="button button-secondary keyword-search-button" type="button" title="按当前关键词立即检索">检索</button>
            </div>
          </div>

          <fieldset class="mode-field browser-field">
            <legend>监控浏览器</legend>
            <div class="segmented-control">
              <label>
                <input type="radio" name="browser" value="edge" checked>
                <span>Edge</span>
              </label>
              <label>
                <input type="radio" name="browser" value="chrome">
                <span>Chrome</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="mode-field">
            <legend>访问方式</legend>
            <div class="segmented-control">
              <label>
                <input type="radio" name="access_mode" value="login" checked>
                <span>登录模式</span>
              </label>
              <label>
                <input type="radio" name="access_mode" value="guest">
                <span>游客模式</span>
              </label>
            </div>
          </fieldset>

          <div class="field-grid">
            <label class="field">
              <span>价格低于</span>
              <span class="price-input"><b>¥</b><input id="maxPrice" name="max_price" type="number" min="0.01" step="0.01" value="60"></span>
            </label>
            <label class="field">
              <span>固定间隔</span>
              <span class="unit-input"><input id="interval" name="interval" type="number" min="30" max="3600" step="1" value="60" inputmode="numeric"><b>秒</b></span>
            </label>
          </div>

          <fieldset class="mode-field interval-mode-field">
            <legend>刷新方式</legend>
            <div class="segmented-control">
              <label>
                <input type="radio" name="interval_mode" value="fixed">
                <span>固定秒数</span>
              </label>
              <label>
                <input type="radio" name="interval_mode" value="cycle" checked>
                <span>1-5 分钟循环</span>
              </label>
            </div>
          </fieldset>

          <label class="toggle-row">
            <strong>系统文字弹窗</strong>
            <input id="popupEnabled" type="checkbox" checked>
            <span class="toggle" aria-hidden="true"></span>
          </label>

          <div class="notification-overview">
            <div class="notification-overview-heading">
              <strong>消息通知</strong>
              <button id="notificationSettingsButton" class="text-button" type="button">设置</button>
            </div>
            <div class="notification-route-list" aria-label="消息通知状态">
              <span><i id="wecomStatusDot" class="route-dot"></i>企业微信 <b id="wecomStatusText">未配置</b></span>
              <span><i id="dingtalkStatusDot" class="route-dot"></i>钉钉 <b id="dingtalkStatusText">未配置</b></span>
            </div>
          </div>

          <div class="primary-actions">
            <button id="startButton" class="button button-primary" type="submit"><span aria-hidden="true">▶</span><span id="startButtonLabel">启动监控</span></button>
            <button id="stopButton" class="button button-stop" type="button"><span aria-hidden="true">■</span><span id="stopButtonLabel">暂停</span></button>
          </div>
        </form>

        <div class="rail-divider"></div>

        <section class="scan-meta" aria-label="扫描状态">
          <div>
            <span>上次扫描</span>
            <strong id="lastScan">--</strong>
          </div>
          <div>
            <span>下次扫描</span>
            <strong id="nextScan">--</strong>
          </div>
          <div>
            <span>本轮商品</span>
            <strong id="itemCount">0</strong>
          </div>
          <div>
            <span>已见商品</span>
            <strong id="knownCount">0</strong>
          </div>
        </section>

        <section class="session-health" aria-label="长期会话状态">
          <div>
            <span>会话时长</span>
            <strong id="sessionUptime">--</strong>
          </div>
          <div>
            <span>页面请求</span>
            <strong id="requestCount">0</strong>
          </div>
          <div>
            <span>安全暂停</span>
            <strong id="safetyPauseCount">0 次</strong>
          </div>
        </section>

        <button id="scanButton" class="button button-secondary" type="button"><span aria-hidden="true">↻</span>立即扫描</button>

        <section class="activity" aria-labelledby="activityTitle">
          <div class="activity-heading">
            <span id="activityTitle" class="section-label">运行记录</span>
          </div>
          <ol id="activityList" class="activity-list"></ol>
        </section>
      </aside>

      <section class="feed" aria-labelledby="feedTitle">
        <div id="scanBand" class="scan-band"><span></span></div>
        <div class="feed-header">
          <div>
            <span class="section-label">实时推送 · <b id="keywordTitle">mardi短袖</b></span>
            <h1 id="feedTitle">低于 <span id="priceTitle">¥60</span> 的新商品</h1>
          </div>
          <div class="feed-actions">
            <span id="alertCount" class="alert-count">0 条</span>
            <button id="clearButton" class="icon-button" type="button" title="清空推送记录" aria-label="清空推送记录">×</button>
          </div>
        </div>

        <div id="errorBanner" class="error-banner" role="alert" hidden></div>
        <div id="feedGrid" class="feed-grid"></div>
        <div id="emptyState" class="empty-state">
          <div class="radar-glyph" aria-hidden="true"><span></span></div>
          <strong>等待新商品</strong>
          <span id="emptyStatus">尚未建立基线</span>
        </div>
      </section>
    </main>
  </div>

  <dialog id="notificationDialog" class="notification-dialog" aria-labelledby="notificationDialogTitle">
    <div class="dialog-frame">
      <header class="dialog-header">
        <div>
          <span class="section-label">通知渠道</span>
          <h2 id="notificationDialogTitle">消息通知</h2>
        </div>
        <button id="notificationCloseButton" class="icon-button" type="button" title="关闭" aria-label="关闭">×</button>
      </header>

      <form id="notificationForm">
        <section class="channel-setting" aria-labelledby="wecomChannelTitle">
          <header class="channel-header">
            <div class="channel-identity">
              <span class="channel-mark wecom" aria-hidden="true">企</span>
              <div>
                <strong id="wecomChannelTitle">企业微信</strong>
                <span id="wecomDialogStatus" class="channel-state">未配置</span>
              </div>
            </div>
            <label class="switch-control" title="启用企业微信通知">
              <input id="wecomEnabled" type="checkbox">
              <span class="toggle" aria-hidden="true"></span>
              <span class="sr-only">启用企业微信通知</span>
            </label>
          </header>
          <label class="field dialog-field">
            <span>Webhook 地址</span>
            <input id="wecomWebhook" type="password" autocomplete="new-password" spellcheck="false">
          </label>
          <div class="channel-actions">
            <button id="wecomTestButton" class="button button-secondary" type="button">测试企业微信</button>
            <button id="wecomClearButton" class="button button-remove" type="button">移除</button>
          </div>
        </section>

        <section class="channel-setting" aria-labelledby="dingtalkChannelTitle">
          <header class="channel-header">
            <div class="channel-identity">
              <span class="channel-mark dingtalk" aria-hidden="true">钉</span>
              <div>
                <strong id="dingtalkChannelTitle">钉钉</strong>
                <span id="dingtalkDialogStatus" class="channel-state">未配置</span>
              </div>
            </div>
            <label class="switch-control" title="启用钉钉通知">
              <input id="dingtalkEnabled" type="checkbox">
              <span class="toggle" aria-hidden="true"></span>
              <span class="sr-only">启用钉钉通知</span>
            </label>
          </header>
          <div class="dialog-field-grid">
            <label class="field dialog-field">
              <span>Webhook 地址</span>
              <input id="dingtalkWebhook" type="password" autocomplete="new-password" spellcheck="false">
            </label>
            <label class="field dialog-field">
              <span>加签密钥（可选）</span>
              <input id="dingtalkSecret" type="password" autocomplete="new-password" spellcheck="false">
            </label>
          </div>
          <div class="channel-actions">
            <button id="dingtalkTestButton" class="button button-secondary" type="button">测试钉钉</button>
            <button id="dingtalkClearButton" class="button button-remove" type="button">移除</button>
          </div>
        </section>

        <footer class="dialog-footer">
          <button id="notificationCancelButton" class="button button-secondary" type="button">取消</button>
          <button id="notificationSaveButton" class="button button-primary" type="submit">保存通知设置</button>
        </footer>
      </form>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
